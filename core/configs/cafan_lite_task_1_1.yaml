config_type: experiment
model:
  name: cafan_lite
  nfeature_dim: 6
  efeature_dim: 5
  output_dim: 6
  hidden_dim: 128
  n_gnn_layers: 6
  n_heads: 4
  dropout_rate: 0.1
  use_bus_type: true
  apply_known_values: false
  K: 4
dataset:
  datasets:
  - add_bus_type: false
    case_name: case30
    model: PFNet
    name: pfdeltaPFNet
    root_dir: data/pfdelta_data
    split: train
    task: 1.1
    transform: pfnet_data_mean0_var1
  - add_bus_type: false
    case_name: case30
    model: PFNet
    name: pfdeltaPFNet
    root_dir: data/pfdelta_data
    split: val
    task: 1.1
    transform: pfnet_data_mean0_var1
functional:
  trainer_name: gnn_trainer
  run_name: cafan_lite_task_1_1_h128_L6_H4
  run_location: cafan_lite_task_1_1
  seed: 42
optim:
  optimizer:
    lr: 0.0001
    name: Adam
  train_params:
    batch_size: 64
    epochs: 150
    train_loss:
    - name: GNNTorchLoss
      output_name: bus__y
      torch_nn_name: MSELoss
    - name: pfn_masked_mse
      regularize: false
    - name: pfn_masked_mse
      regularize: true
    - model: PFNet
      name: universal_power_balance
    - keyword: pbl_pf
      loss_name: PBL Max
      name: recycle_loss
      recycled_parameter: power_balance_max
    - keyword: pbl_pf
      loss_name: PBL L2
      name: recycle_loss
      recycled_parameter: power_balance_l2
  val_params:
    batch_size: 64
    early_stop:
      decrease_by: 0.01
      decrease_for: 10
      needs_best_every: 15
    report_every: 2
    val_loss:
    - name: pfn_masked_mse
      regularize: false
    - name: pfn_masked_mse
      regularize: true
    - name: GNNTorchLoss
      output_name: bus__y
      torch_nn_name: MSELoss
    - model: PFNet
      name: universal_power_balance
    - keyword: pbl_pf
      loss_name: PBL Max
      name: recycle_loss
      recycled_parameter: power_balance_max
    - keyword: pbl_pf
      loss_name: PBL L2
      name: recycle_loss
      recycled_parameter: power_balance_l2
