config_type: experiment
model:
  K: 4
  n_gnn_layers: 5
  dropout_rate: 0.2
  efeature_dim: 5
  hidden_dim: 256
  name: powerflownet
  nfeature_dim: 6
  output_dim: 6
dataset:
  datasets:
  - add_bus_type: false
    case_name: case2000
    model: PFNet
    name: pfdeltaPFNet
    root_dir: data/pfdelta_data
    split: train
    task: 1.1
  - add_bus_type: false
    case_name: case2000
    model: PFNet
    name: pfdeltaPFNet
    root_dir: data/pfdelta_data
    split: val
    task: 1.1
functional:
  trainer_name: gnn_trainer
  run_name: pfnet_case2000_K4_layers5_hd256_lr1e-4_task1_1
  run_location: pfnet_task_1_1_case2000
  seed: 11
optim:
  optimizer:
    lr: 0.0001
    name: Adam
  train_params:
    batch_size: 2
    epochs: 100
    train_loss:
    - name: GNNTorchLoss
      output_name: bus__y
      torch_nn_name: MSELoss
    - name: pfn_masked_mse
      regularize: false
    - name: pfn_masked_mse
      regularize: true
  val_params:
    batch_size: 2
    early_stop:
      decrease_by: 0.01
      decrease_for: 10
      needs_best_every: 15
    report_every: 2
    val_loss:
    - name: pfn_masked_mse
      regularize: false
    - name: pfn_masked_mse
      regularize: true
    - name: GNNTorchLoss
      output_name: bus__y
      torch_nn_name: MSELoss
