config_type: experiment
dataset:
  datasets:
  - add_bus_type: false
    case_name: case57
    model: GNS
    name: pfdeltaGNS
    root_dir: data/pfdelta_data
    split: train
    task: 2.2
  - add_bus_type: false
    case_name: case57
    model: GNS
    name: pfdeltaGNS
    root_dir: data/pfdelta_data
    split: val
    task: 2.2
functional:
  run_location: gns_case57_task_2_2
  run_name: gns_case57_task2_2
  seed: 11
  trainer_name: gnn_trainer
model:
  K: 10
  gamma: 0.01
  hidden_dim: 20
  name: graph_neural_solver
optim:
  optimizer:
    lr: 0.0003
    name: Adam
  train_params:
    batch_size: 64
    epochs: 100
    train_loss:
    - name: gns_layer_loss
    - name: gns_last_loss
    - model: GNS
      name: universal_power_balance
  val_params:
    batch_size: 64
    early_stop:
      decrease_by: 0.01
      decrease_for: 10
      needs_best_every: 15
    report_every: 2
    val_loss:
    - name: gns_layer_loss
    - name: gns_last_loss
    - model: GNS
      name: universal_power_balance
